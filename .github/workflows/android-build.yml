name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test artifact manifest tooling
        run: python3 -m unittest discover -s tools/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK and run unit tests
        # Record mode makes Roborazzi write KeyboardScreenshotTest's PNGs (it writes
        # nothing otherwise); they are uploaded below as `ui-screenshots`.
        run: ./gradlew assembleDebug testDebugUnitTest -Proborazzi.test.record=true --stacktrace

      # Compiles the R8-minified release APK (unsigned - CI has no keystore) so
      # shrinking/obfuscation problems surface on every push, not at ship time.
      - name: Build release APK (R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            core/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            core/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      - name: Record debug APK provenance
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 tools/build_manifest.py app/build/outputs/apk/debug/app-debug.apk
          --commit "$CANDIDATE_SHA" --run-url "$CANDIDATE_RUN_URL"
          --output app/build/outputs/apk/debug/build-manifest.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-manifest.json
          if-no-files-found: error
