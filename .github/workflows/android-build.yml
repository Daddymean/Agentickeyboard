name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # A fixed debug key makes every CI debug APK install over the previous one.
      # Without it each runner signs with a fresh throwaway key, and Android
      # refuses the update ("package conflicts with an existing package").
      # The debug key protects nothing, so it is used on every event.
      - name: Install fixed debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "app-debug will be signed with the fixed CI debug key."
          else
            echo "Using the committed debug.keystore (set DEBUG_KEYSTORE_BASE64 to override)."
          fi

      - name: Build debug APK and run unit tests
        # Record mode makes Roborazzi write KeyboardScreenshotTest's PNGs (it writes
        # nothing otherwise); they are uploaded below as `ui-screenshots`.
        run: ./gradlew assembleDebug testDebugUnitTest -Proborazzi.test.record=true --stacktrace

      # The release (upload) key is exposed only to pushes to main/master and manual
      # runs, never to pull_request builds: those run the PR branch's own build
      # scripts, which must not be able to read the key. PR builds therefore
      # produce an unsigned release APK, as before.
      - name: Install release signing key
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release APK will be signed with the upload key."
          else
            echo "::warning::Release signing secrets are not all set: the release APK stays unsigned."
          fi

      # Builds the R8-minified release APK so shrinking/obfuscation problems surface
      # on every run. Signed when the step above installed the upload key.
      - name: Build release APK (R8)
        env:
          STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS || '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name release artifact
        id: release
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "artifact=app-release" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=app-release-unsigned" >> "$GITHUB_OUTPUT"
          fi

      # Prints each APK's signing certificate so a run shows at a glance whether it
      # is installable and which key signed it (same digest = updates in place).
      - name: Show APK signing certificates
        continue-on-error: true
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)" || echo "   not signed: cannot be installed"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            core/build/reports/tests/testDebugUnitTest
            context-app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload context-app debug APK
        uses: actions/upload-artifact@v4
        with:
          name: context-app-debug
          path: context-app/build/outputs/apk/debug/context-app-debug.apk
          if-no-files-found: error

      # Android lint for every module (lintDebug runs in :app, :core and :context-app). Lint
      # errors fail the build; warnings are reported but do not (main currently
      # has 0 errors, so no baseline is needed). Runs last so a lint failure never
      # prevents the APK/test/screenshot artifacts above from uploading.
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            core/build/reports/lint-results-debug.*
            context-app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
